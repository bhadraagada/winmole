name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'

      - name: Run Tests
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -SkipPublisherCheck -MinimumVersion 5.0
          Import-Module Pester -MinimumVersion 5.0
          
          $config = New-PesterConfiguration
          $config.Run.Path = "./tests"
          $config.Run.Exit = $true
          $config.Filter.ExcludeTag = @("Integration")
          
          Invoke-Pester -Configuration $config

      - name: Build release archives
        shell: pwsh
        run: |
          ./scripts/build-portable-package.ps1 -Architecture amd64 -OutputDirectory artifacts
          ./scripts/build-portable-package.ps1 -Architecture arm64 -OutputDirectory artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: |
            artifacts/winmole-windows-amd64.zip
            artifacts/winmole-windows-arm64.zip
            artifacts/bin/*-windows-*.exe
          if-no-files-found: error
          retention-days: 5

  smoke:
    name: Smoke release archive (${{ matrix.architecture }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: windows-2025
          - architecture: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      PACKAGE_ARCH: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: release-binaries
          path: artifacts

      - name: Smoke-test the exact release archive without changing PowerShell policy
        shell: pwsh
        run: ./scripts/test-portable-package.ps1 -Archive "artifacts/winmole-windows-$env:PACKAGE_ARCH.zip"

  release:
    name: Publish Release
    needs: smoke
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-binaries
          path: artifacts

      - name: Display structure
        run: ls -R artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            artifacts/winmole-windows-amd64.zip
            artifacts/winmole-windows-arm64.zip
            artifacts/bin/*-windows-*.exe
          generate_release_notes: true
          draft: false
          prerelease: false

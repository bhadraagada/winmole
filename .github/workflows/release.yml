name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/build-portable-package.ps1'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'

      - name: Run Tests
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -SkipPublisherCheck -MinimumVersion 5.0
          Import-Module Pester -MinimumVersion 5.0
          
          $config = New-PesterConfiguration
          $config.Run.Path = "./tests"
          $config.Run.Exit = $true
          $config.Filter.ExcludeTag = @("Integration")
          
          Invoke-Pester -Configuration $config

      - name: Build release archives
        shell: pwsh
        run: |
          ./scripts/build-portable-package.ps1 -Architecture amd64 -OutputDirectory artifacts
          ./scripts/build-portable-package.ps1 -Architecture arm64 -OutputDirectory artifacts

      - name: Write checksums for the final ZIPs
        shell: pwsh
        run: |
          $archives = @('winmole-windows-amd64.zip', 'winmole-windows-arm64.zip')
          $lines = foreach ($archive in $archives) {
              $hash = Get-FileHash -LiteralPath (Join-Path 'artifacts' $archive) -Algorithm SHA256 -ErrorAction Stop
              "$($hash.Hash.ToLowerInvariant())  $archive"
          }
          $checksumPath = Join-Path ((Get-Item -LiteralPath 'artifacts').FullName) 'SHA256SUMS'
          [IO.File]::WriteAllText($checksumPath, ($lines -join "`n") + "`n", [Text.Encoding]::ASCII)

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: |
            artifacts/winmole-windows-amd64.zip
            artifacts/winmole-windows-arm64.zip
            artifacts/bin/*-windows-*.exe
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 5

  smoke:
    name: Smoke release archive (${{ matrix.architecture }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: windows-2025
          - architecture: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      PACKAGE_ARCH: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: release-binaries
          path: artifacts

      - name: Smoke-test the exact release archive without changing PowerShell policy
        shell: pwsh
        run: ./scripts/test-portable-package.ps1 -Archive "artifacts/winmole-windows-$env:PACKAGE_ARCH.zip"

  verify:
    name: Verify transferred ZIP checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-binaries
          path: artifacts

      - name: Verify hashes against the downloaded ZIPs
        shell: bash
        working-directory: artifacts
        run: sha256sum winmole-windows-amd64.zip winmole-windows-arm64.zip | cmp - SHA256SUMS

  release:
    name: Publish Release
    needs: [smoke, verify]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-binaries
          path: artifacts

      - name: Verify exact bytes before publication
        shell: bash
        working-directory: artifacts
        run: sha256sum winmole-windows-amd64.zip winmole-windows-arm64.zip | cmp - SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/winmole-windows-amd64.zip
            artifacts/winmole-windows-arm64.zip
            artifacts/bin/*-windows-*.exe
            artifacts/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false

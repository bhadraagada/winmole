name: Release

on:
  push:
    tags:
      - 'W*'  # Windows releases use W prefix (e.g., W1.0.0)

permissions:
  contents: write

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.6"

      - name: Build Binaries
        run: |
          cd cmd/analyze
          go build -ldflags="-s -w" -o analyze.exe .
          cd ../status
          go build -ldflags="-s -w" -o status.exe .
        shell: pwsh

      - name: Create release package
        run: |
          # Create release directory
          New-Item -ItemType Directory -Force -Path release
          
          # Copy binaries
          Copy-Item cmd/analyze/analyze.exe release/ -ErrorAction Stop
          Copy-Item cmd/status/status.exe release/ -ErrorAction Stop
          
          # Copy PowerShell scripts
          Copy-Item winmole.ps1 release/ -ErrorAction Stop
          Copy-Item install.ps1 release/ -ErrorAction Stop
          Copy-Item -Recurse bin release/ -ErrorAction Stop
          Copy-Item -Recurse lib release/ -ErrorAction Stop
          
          # Copy docs
          Copy-Item README.md release/ -ErrorAction Stop
          Copy-Item LICENSE release/ -ErrorAction Stop
          
          # Create zip
          Compress-Archive -Path release/* -DestinationPath winmole-windows.zip
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: winmole-windows.zip
          retention-days: 5

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release

      - name: Display downloaded files
        run: ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: winmole-windows.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          name: "WinMole for Windows ${{ github.ref_name }}"
          body: |
            ## WinMole for Windows
            
            Windows port of the WinMole system maintenance toolkit.
            
            ### Installation
            
            **Quick install:**
            ```powershell
            irm https://raw.githubusercontent.com/bhadraagada/winmole/master/install.ps1 | iex
            ```
            
            **Manual install:**
            1. Download and extract `winmole-windows.zip`
            2. Run `install.ps1`
            
            ### Features
            - Deep system cleanup (temp files, caches, logs)
            - Smart app uninstaller with leftover detection
            - Disk space analyzer (TUI)
            - System status monitor (TUI)
            - Developer artifact cleanup
            - System optimization

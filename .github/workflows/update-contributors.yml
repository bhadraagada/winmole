name: Update Contributors

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download contributors image
        run: |
          curl -fsSL "https://contrib.rocks/image?repo=bhadraagada/winmole" -o CONTRIBUTORS.svg

      - name: Commit if changed
        run: |
          if git diff --quiet CONTRIBUTORS.svg; then
            echo "No contributor changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CONTRIBUTORS.svg
          git commit -m "docs: update contributors"
          git push

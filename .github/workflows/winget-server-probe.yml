name: Disposable WinGet x64 server probe

on:
  push:
    branches:
      - dot/winget-server-probe
    paths:
      - .github/workflows/winget-server-probe.yml
      - scripts/test-winget-local-lifecycle.ps1
      - .github/qa/winget-release/**

permissions:
  actions: read
  contents: read

jobs:
  x64-server:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      WINGET_BUNDLE_SHA256: 65dea9c01ce08ee7b763366b27c0e651f97db857c11ca9b9c301826c10092f2e
      WINGET_DEPENDENCIES_SHA256: ba875afe9d190f61218985ac0292a99d1db710bf93e13c68944ca9d89f0d82d1
      CANDIDATE_ARM64_SHA256: 87c20051063e4e53a888d2fa76607ebefc4b380b2796047473633fab78f8c302
      CANDIDATE_X64_SHA256: d7ac2b9853bc540a20e8099b168c24ecc257d893a95ff8e2733cf109e1e0f953
    steps:
      - name: Observe bare runner's Windows PowerShell policy
        shell: cmd
        run: |
          "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -Command "Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,ProductType | Format-List; Get-ExecutionPolicy; Get-ExecutionPolicy -List | Format-Table -AutoSize; Write-Output ('Process policy environment set: ' + (Test-Path Env:PSExecutionPolicyPreference))"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Independently verify published HTTPS assets before WinGet checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/bhadraagada/winmole/releases/download/v0.1.2'
          $null = New-Item -ItemType Directory -Path 'exact-candidate'
          $expected = @{
            'winmole-windows-amd64.zip' = $env:CANDIDATE_X64_SHA256
            'winmole-windows-arm64.zip' = $env:CANDIDATE_ARM64_SHA256
          }
          foreach ($asset in $expected.Keys) {
            $path = Join-Path 'exact-candidate' $asset
            & curl.exe --proto '=https' --proto-redir '=https' --fail --location --silent --show-error --max-time 100 --output $path "$base/$asset"
            if ($LASTEXITCODE -ne 0) { throw "Official release asset download failed: $asset" }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            if ($actual -ne $expected[$asset]) { throw "Unexpected release SHA-256 for $asset" }
            Write-Host "Verified $base/$asset SHA-256: $actual"
          }

      - name: Observe or bootstrap signed stable Microsoft WinGet
        if: ${{ always() }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $winget = Get-Command winget.exe -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
          $supportsManifest = $false
          if ($winget) {
            $installedVersion = & $winget.Source --version
            $supportsManifest = $LASTEXITCODE -eq 0 -and $installedVersion -match '^v(\d+\.\d+\.\d+)$' -and
              [version]$Matches[1] -ge [version]'1.29.380'
            Write-Host "Preinstalled WinGet: $installedVersion; sufficient for final schema probe: $supportsManifest"
          }
          $root = Join-Path $env:RUNNER_TEMP 'signed-app-installer'
          if (-not $supportsManifest) {
            $null = New-Item -ItemType Directory -Path $root
            $base = 'https://github.com/microsoft/winget-cli/releases/download/v1.29.380'
            $bundleName = 'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle'
            $depName = 'DesktopAppInstaller_Dependencies.zip'
            $bundle = Join-Path $root $bundleName
            $deps = Join-Path $root $depName
            & curl.exe --fail --location --silent --show-error --max-time 120 --output $bundle "$base/$bundleName"
            if ($LASTEXITCODE -ne 0) { throw 'Could not obtain signed stable Microsoft bundle' }
            & curl.exe --fail --location --silent --show-error --max-time 120 --output $deps "$base/$depName"
            if ($LASTEXITCODE -ne 0) { throw 'Could not obtain stable Microsoft bundle dependencies' }
            if ((Get-FileHash -LiteralPath $bundle).Hash -ne $env:WINGET_BUNDLE_SHA256 -or
                (Get-FileHash -LiteralPath $deps).Hash -ne $env:WINGET_DEPENDENCIES_SHA256) {
              throw 'Unexpected Microsoft App Installer release bytes'
            }
            $expanded = Join-Path $root 'dependencies'
            Expand-Archive -LiteralPath $deps -DestinationPath $expanded
            $depPaths = @(Get-ChildItem -Path (Join-Path $expanded 'x64\*.appx') -File | Select-Object -ExpandProperty FullName)
            if ($depPaths.Count -ne 3) { throw 'Unexpected x64 dependencies' }
            # Default trust; cap per-user MSIX registration separately.
            $env:WINGET_PROBE_BUNDLE = $bundle
            $env:WINGET_PROBE_DEPS = Join-Path $expanded 'x64'
            $env:WINGET_PROBE_REGISTERED = Join-Path $root 'registered-ok.txt'
            $ps = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
            $worker = Join-Path $root 'register.ps1'
            @'
          $ErrorActionPreference = 'Stop'
          try {
              $dependencies = Get-ChildItem -Path (Join-Path $env:WINGET_PROBE_DEPS '*.appx') -File
              $missing = @(
                  foreach ($dep in $dependencies) {
                      if ($dep.Name -notmatch '^(.+)_([0-9.]+)_x64\.appx$') { throw 'Unexpected Microsoft dependency filename' }
                      $name = $Matches[1]
                      $minimum = [version]$Matches[2]
                      $present = @(Get-AppxPackage -Name $name | Where-Object {
                          $_.Architecture -in @('X64','Neutral') -and [version]$_.Version -ge $minimum
                      }).Count -gt 0
                      if (-not $present) { $dep.FullName }
                  }
              )
              $appx = @{ Path = $env:WINGET_PROBE_BUNDLE; ErrorAction = 'Stop' }
              if ($missing.Count -gt 0) { $appx.DependencyPath = $missing }
              Write-Output "$($missing.Count) separately supplied dependencies"
              Add-AppxPackage @appx
              [IO.File]::WriteAllText($env:WINGET_PROBE_REGISTERED, 'registered')
          } catch {
              [Console]::Error.WriteLine($_.ToString())
              exit 1
          }
          '@ | Set-Content -LiteralPath $worker -Encoding UTF8
            $regOut = Join-Path $root 'register.stdout'
            $regErr = Join-Path $root 'register.stderr'
            $proc = Start-Process $ps -ArgumentList ('-NoLogo -NoProfile -NonInteractive -File "' + $worker + '"') -PassThru -NoNewWindow -RedirectStandardOutput $regOut -RedirectStandardError $regErr
            if (-not $proc.WaitForExit(90000)) {
              if (-not $proc.HasExited) { Stop-Process -Id $proc.Id }
              Get-Content -LiteralPath $regOut,$regErr
              throw 'MSIX registration exceeded 90 seconds on disposable Windows Server'
            }
            Get-Content -LiteralPath $regOut,$regErr
            if ((Get-Content -LiteralPath $env:WINGET_PROBE_REGISTERED -ErrorAction SilentlyContinue) -ne 'registered') {
              throw 'MSIX child did not confirm successful registration'
            }
            $winget = Get-Command winget.exe -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($null -ne $winget) {
            $exe = $winget.Source
          } else {
            $package = Get-AppxPackage -Name Microsoft.DesktopAppInstaller
            if ($null -eq $package) { throw 'App Installer not registered in disposable runner account' }
            $exe = Join-Path $package.InstallLocation 'winget.exe'
          }
          $version = & $exe --version
          Write-Host "WinGet version: $version"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^v(\d+\.\d+\.\d+)$' -or
              [version]$Matches[1] -lt [version]'1.29.380') { throw 'Modern stable WinGet could not run' }
          & $exe settings export
          if ($LASTEXITCODE -ne 0) { throw 'WinGet admin-settings observation failed' }
          "WINGET_QA_EXE=$exe" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding UTF8 -Append

      - name: Run real WinGet validation against exact proposed manifests
        if: ${{ always() && env.WINGET_QA_EXE != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:WINGET_QA_EXE validate --manifest '.github/qa/winget-release'
          if ($LASTEXITCODE -ne 0) { throw 'WinGet validation rejected the exact proposed manifests' }
          Write-Host 'Exact proposed WinGet manifests validated with official versioned GitHub release URLs.'

      - name: Exercise actual WinGet user-scope portable lifecycle on exact published release artifacts
        if: ${{ always() && env.WINGET_QA_EXE != '' }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          ./scripts/test-winget-local-lifecycle.ps1 -Winget $env:WINGET_QA_EXE -Candidate 'exact-candidate/winmole-windows-amd64.zip' -ManifestDir '.github/qa/winget-release'
